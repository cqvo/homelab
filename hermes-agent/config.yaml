# Hermes LLM backend — single source of truth for model selection (env vars are unsupported).
# Points at the homelab's local ollama OpenAI-compatible endpoint (see local-llm/ stack).
model:
  # Must match the model tag actually served by ollama (local-llm/ runs ...:Q3_K_M).
  default: hf.co/yuxinlu1/gemma-4-12B-agentic-fable5-composer2.5-v2-3.5x-tau2-GGUF:Q3_K_M
  provider: custom
  # hermes shares the tailscale netns, so localhost is NOT the host. Use an address the
  # container can actually reach: the homelab host's Tailscale name/IP (tailnet-native) or
  # its LAN IP. Replace OLLAMA_HOST below before deploying.
  base_url: http://OLLAMA_HOST:11434/v1
  # ollama needs no API key.
  context_length: 64000
