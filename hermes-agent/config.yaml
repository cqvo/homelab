# Hermes LLM backend — config.yaml is the source of truth for model selection.
# Values are env vars (passed in via docker-compose) that Hermes expands at load time
# using ${VAR} interpolation. Set them in .env; do not hardcode here.
model:
  default: ${MODEL_NAME}
  provider: custom
  # hermes shares the tailscale netns, so localhost is NOT the host. MODEL_ENDPOINT is the
  # full OpenAI-compatible URL (protocol, host, port, /v1) the container can reach
  # (e.g. http://<homelab-host-tailnet-or-LAN>:11434/v1).
  base_url: ${MODEL_ENDPOINT}
  # ollama needs no API key.
  context_length: 64000
