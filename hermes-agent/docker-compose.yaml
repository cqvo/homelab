services:
  tailscale:
    image: tailscale/tailscale:v1.98.4
    container_name: hermes-tailscale
    hostname: hermes
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--reset
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  hermes-agent:
    image: nousresearch/hermes-agent
    container_name: hermes
    command: gateway run
    network_mode: service:tailscale
    # Access is via the tailnet on :443, proxied to 127.0.0.1:8642 (see serve.json).
    # Telegram runs in polling mode (outbound only) and needs no inbound port.
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - TELEGRAM_HOME_CHANNEL=${TELEGRAM_HOME_CHANNEL}
      # Consumed by config.yaml via ${VAR} interpolation (custom ollama model backend).
      - MODEL_NAME=${MODEL_NAME}
      - MODEL_ENDPOINT=${MODEL_ENDPOINT}
      - BACKUP_MODEL_NAME=${BACKUP_MODEL_NAME}
      - BACKUP_MODEL_ENDPOINT=${BACKUP_MODEL_ENDPOINT}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL_NAME=${OPENROUTER_MODEL_NAME}
    volumes:
      - hermes-state:/opt/data
      # Model/provider config — config.yaml is the single source of truth for the LLM backend.
      - ./config.yaml:/opt/data/config.yaml
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hermes-state:
  tailscale-state:
