services:
  tailscale:
    image: tailscale/tailscale:v1.98.4
    container_name: home-assistant-tailscale
    hostname: home-assistant               # -> MagicDNS name "home-assistant"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--reset              # keep serve config in sync on restart
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2025.12
    container_name: home-assistant
    network_mode: service:tailscale         # share tailscale's net namespace
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - ./config:/config                    # HA writes its own files here
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
    restart: unless-stopped

volumes:
  tailscale-state:
