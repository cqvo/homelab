services:
  tailscale:
    image: tailscale/tailscale:v1.98.4
    container_name: grafana-tailscale
    hostname: grafana                     # -> MagicDNS name "grafana"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--reset             # keep serve config in sync on restart
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:13.1.0
    container_name: grafana
    network_mode: service:tailscale       # share tailscale's net namespace
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      # So Grafana builds correct absolute URLs behind the Serve proxy.
      # Fill TS_TAILNET in .env (e.g. tailnet-abcd.ts.net).
      - GF_SERVER_ROOT_URL=https://grafana.${TS_TAILNET}/
    restart: unless-stopped

volumes:
  tailscale-state:
  grafana-data:
