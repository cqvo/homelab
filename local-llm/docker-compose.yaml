services:
  tailscale:
    image: tailscale/tailscale:v1.98.4
    container_name: local-llm-tailscale
    hostname: local-llm
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      # Kernel networking (not userspace) so the ollama container sharing this
      # netns is reachable on the tailnet at its native :11434, and can also make
      # outbound tailnet connections.
      - TS_USERSPACE=false
      # Resolve MagicDNS names for tailnet hostnames.
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=--reset
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:0.30.10
    container_name: ollama
    # Share the tailscale netns: reachable on the tailnet as local-llm:11434
    # (native API) and https://local-llm (HTTPS 443, see serve.json). No host
    # ports — tailnet-only access.
    network_mode: service:tailscale
    volumes:
      - ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      tailscale:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:0.30.10
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Ollama lives in the tailscale container's netns; reach it via the
      # tailscale service name on the compose network.
      - OLLAMA_HOST=http://tailscale:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama run hf.co/yuxinlu1/gemma-4-12B-agentic-fable5-composer2.5-v2-3.5x-tau2-GGUF:Q3_K_M"
    restart: "no"

volumes:
  ollama:
  tailscale-state:
